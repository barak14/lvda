<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="250" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="249" rx="13.5" fill="none" stroke="#263043"/>

  <!-- wordmark -->
  <text x="64" y="118" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, monospace"
        font-size="82" font-weight="700" fill="url(#accent)">lvda</text>
  <text x="68" y="158" font-size="21" fill="#e6edf3">virtual displays for Linux game streaming</text>
  <text x="68" y="188" font-size="14" fill="#8b98a9">DRM kernel module &#183; exact modes &#183; zero-copy capture &#183; no dummy plug</text>

  <!-- monitor pool: two parked slots, one lit -->
  <g>
    <!-- parked slot 2 -->
    <g opacity="0.55">
      <rect x="586" y="52" width="108" height="70" rx="7" fill="#0d1117" stroke="#39445a" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="640" y="92" font-size="11" fill="#5b6778" text-anchor="middle">Virtual&#8209;2</text>
    </g>
    <!-- parked slot 3 -->
    <g opacity="0.35">
      <rect x="712" y="52" width="108" height="70" rx="7" fill="#0d1117" stroke="#39445a" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="766" y="92" font-size="11" fill="#5b6778" text-anchor="middle">Virtual&#8209;3</text>
    </g>
    <!-- lit slot 1 -->
    <g filter="url(#glow)">
      <rect x="596" y="120" width="252" height="96" rx="9" fill="url(#screen)" stroke="url(#accent)" stroke-width="2.5"/>
    </g>
    <rect x="704" y="220" width="36" height="7" rx="3.5" fill="#39445a"/>
    <rect x="686" y="229" width="72" height="6" rx="3" fill="#39445a"/>
    <text x="722" y="152" font-family="ui-monospace, Menlo, monospace" font-size="20" font-weight="600"
          fill="#f0f6ff" text-anchor="middle">2560&#215;1440</text>
    <text x="722" y="178" font-family="ui-monospace, Menlo, monospace" font-size="15"
          fill="#c9d6ff" text-anchor="middle">144.000 Hz &#183; HDR10</text>
    <text x="722" y="201" font-size="11.5" fill="#9fb3d9" text-anchor="middle">Virtual&#8209;1 &#183; connected</text>
  </g>
</svg>
